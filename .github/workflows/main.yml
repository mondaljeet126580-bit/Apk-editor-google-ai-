name: Build APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate missing debug.keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            python3 - << 'EOF'
          import re, pathlib, subprocess

          text = ""
          for p in [pathlib.Path("app/build.gradle.kts"), pathlib.Path("app/build.gradle")]:
              if p.exists():
                  text = p.read_text()
                  break

          m = re.search(r'debugConfig[^\{\}]*\{([^}]*)\}', text)
          block = m.group(1) if m else text

          def find_val(key, default):
              res = re.search(rf'{key}\s*=?\s*["\']([^"\']+)["\']', block)
              return res.group(1) if res else default

          store_pass = find_val('storePassword', 'android')
          key_alias = find_val('keyAlias', 'androiddebugkey')
          key_pass = find_val('keyPassword', 'android')

          subprocess.run([
              "keytool", "-genkey", "-v",
              "-keystore", "debug.keystore",
              "-storepass", store_pass,
              "-alias", key_alias,
              "-keypass", key_pass,
              "-keyalg", "RSA",
              "-keysize", "2048",
              "-validity", "10000",
              "-dname", "CN=Android Debug,O=Android,C=US"
          ], check=True)
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: APK Build v1.0.${{ github.run_number }}
          files: "**/build/outputs/apk/debug/*.apk"
